<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDT$</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root { --primary: #1e3a8a; --success: #22c55e; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(135deg, #f8fafc, #e0e7ff); min-height: 100vh; }

    .navbar {
      background: rgba(30, 58, 138, 0.95);
      backdrop-filter: blur(12px);
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      top: 0; width: 100%; z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .nav-left { display: flex; align-items: center; gap: 16px; }
    .menu-btn { font-size: 26px; cursor: pointer; padding: 6px; border-radius: 8px; }
    .menu-btn:hover { background: rgba(255,255,255,0.15); }
    .logo { font-size: 22px; font-weight: 700; }

    .wallet {
      background: rgba(255,255,255,0.18);
      padding: 8px 18px;
      border-radius: 50px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .auth-container {
      max-width: 420px; margin: 80px auto; padding: 40px 35px;
      background: white; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    }

    .sidebar {
      position: fixed; top: 68px; left: -290px; width: 290px; height: calc(100vh - 68px);
      background: #0f172a; color: white; transition: all 0.5s; z-index: 999;
      border-top-right-radius: 24px; box-shadow: 10px 0 30px rgba(0,0,0,0.3);
    }
    .sidebar.active { left: 0; }
    .sidebar ul { list-style: none; padding: 25px 0; }
    .sidebar ul li {
      padding: 16px 28px; display: flex; align-items: center; gap: 16px;
      cursor: pointer; transition: all 0.3s; font-size: 15.8px;
    }
    .sidebar ul li:hover { background: rgba(255,255,255,0.08); transform: translateX(10px); }

    .main-content { margin-top: 68px; padding: 20px; }
    .content {
      background: white; padding: 30px; border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 1100px; margin: 0 auto;
    }

    h1 { color: var(--primary); margin-bottom: 25px; font-size: 28px; font-weight: 700; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      text-align: center;
    }
    .stat-card h3 { color: #64748b; font-size: 15px; font-weight: 600; }
    .stat-card h2 { font-size: 32px; margin: 10px 0; color: #1e3a8a; }

    .form-group { margin-bottom: 24px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #374151; }
    input, select {
      width: 100%; padding: 16px; border: 2px solid #e5e7eb; border-radius: 12px;
      font-size: 16px; transition: 0.3s;
    }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30,58,138,0.15); }

    .btn, .next-btn {
      width: 100%; padding: 15px; background: #1e3a8a; color: white;
      border: none; border-radius: 12px; font-size: 17px; font-weight: 600;
      cursor: pointer; margin-top: 10px;
    }

    .toggle-link { text-align: center; margin-top: 20px; color: #1e3a8a; cursor: pointer; font-weight: 500; }
    .profile-info { background: #f8fafc; padding: 20px; border-radius: 16px; margin: 15px 0; line-height: 1.8; }
    .btn-group { display: flex; gap: 12px; margin-top: 20px; }

    .balance-info {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white; padding: 25px; border-radius: 16px; text-align: center; margin-bottom: 30px;
    }
    .balance-info h1 { font-size: 38px; margin: 8px 0; }

    .withdrawal-item {
      background: #f8fafc; padding: 18px; border-radius: 14px; margin-bottom: 14px;
      border-left: 6px solid #eab308;
    }
    .withdrawal-item.done { border-left-color: #22c55e; }
    .status { padding: 7px 16px; border-radius: 30px; font-size: 14px; font-weight: 600; }
    .pending { background: #fef3c7; color: #d97706; }
    .done { background: #dcfce7; color: #16a34a; }
  </style>
</head>
<body>

  <!-- AUTH SECTION -->
  <div class="auth-container" id="authContainer">
    <div id="loginForm">
      <h2><i class="fas fa-lock"></i> Login Earn USDT</h2>
      <div class="form-group"><label>Email Address</label><input type="email" id="loginEmail" placeholder="your@email.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="Enter password"></div>
      <button class="btn" onclick="loginUser()">Login</button>
      <div class="toggle-link" onclick="showRegister()">Don't have an account? <strong>Register Now</strong></div>
    </div>

    <div id="registerForm" style="display:none;">
      <h2><i class="fas fa-user-plus"></i> Create New Account</h2>
      <div class="form-group"><label>Email Address</label><input type="email" id="regEmail"></div>
      <div class="form-group"><label>Password</label><input type="password" id="regPassword"></div>
      <div class="form-group"><label>Re-enter Password</label><input type="password" id="regConfirmPassword"></div>
      <button class="btn" onclick="registerUser()">Register Account</button>
      <div class="toggle-link" onclick="showLogin()">Already have an account? <strong>Login</strong></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" style="display:none;">
    <nav class="navbar">
      <div class="nav-left">
        <div class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></div>
        <div class="logo">USDT $</div>
      </div>
      <div class="nav-right">
        <div class="wallet" id="navbarWallet">
          <i class="fas fa-wallet"></i> $<span id="walletAmount">0.00</span>
        </div>
        <div onclick="showProfileModal()"><i class="fas fa-user-circle" style="font-size:32px; cursor:pointer;"></i></div>
      </div>
    </nav>

    <div class="sidebar" id="sidebar">
      <ul>
        <li onclick="loadPage('dashboard')"><i class="fas fa-home"></i> Dashboard</li>
        <li onclick="loadPage('email-add')"><i class="fas fa-envelope"></i> Add Email</li>
        <li onclick="loadPage('earn-money')"><i class="fas fa-money-bill-wave"></i> Earn Money</li>
        <li onclick="loadPage('withdrawal')"><i class="fas fa-wallet"></i> Withdrawal</li>
        <li onclick="loadPage('withdrawal-status')"><i class="fas fa-list-check"></i> Withdrawal Status</li>
        <li onclick="loadPage('email-status')"><i class="fas fa-check-circle"></i> Email Status</li>
        <li onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</li>
      </ul>
    </div>

    <div class="main-content">
      <div class="content" id="pageContent"></div>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:2000; align-items:center; justify-content:center;">
    <div style="background:white; width:90%; max-width:520px; border-radius:20px; padding:25px; max-height:92vh; overflow-y:auto;">
      <h2 style="text-align:center; margin-bottom:20px;">👤 My Profile</h2>
      <div id="profileContent"></div>
      <button class="btn" onclick="closeProfileModal()" style="background:#ef4444; margin-top:15px;">Close</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCkl8VO2PKGbAXxVTYPaUWoCNHbu4yvxfw",
      authDomain: "mail-5e9aa.firebaseapp.com",
      databaseURL: "https://mail-5e9aa-default-rtdb.firebaseio.com",
      projectId: "mail-5e9aa",
      storageBucket: "mail-5e9aa.firebasestorage.app",
      messagingSenderId: "641872846790",
      appId: "1:641872846790:web:6fb7aa7725d0a3c10d9cc7"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // Toggle Login/Register
    function showRegister() { document.getElementById('loginForm').style.display='none'; document.getElementById('registerForm').style.display='block'; }
    function showLogin() { document.getElementById('registerForm').style.display='none'; document.getElementById('loginForm').style.display='block'; }

    window.registerUser = function() {
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPassword').value.trim();
      const confirm = document.getElementById('regConfirmPassword').value.trim();
      if (pass !== confirm) return alert("Passwords do not match!");
      if (pass.length < 6) return alert("Password minimum 6 characters hona chahiye");
      auth.createUserWithEmailAndPassword(email, pass).then(() => { alert("Registration Successful!"); showLogin(); }).catch(e => alert(e.message));
    };

    window.loginUser = function() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();
      auth.signInWithEmailAndPassword(email, pass).then(() => {
        document.getElementById('authContainer').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        loadDashboard();
        startLiveWallet();
      }).catch(e => alert("Login Failed: " + e.message));
    };

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('authContainer').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        loadDashboard();
        startLiveWallet();
      }
    });

    document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('active'));

    // Live Wallet
    function calculateAvailableBalance(userId, callback) {
      let earned = 0, withdrawn = 0;
      db.ref('addedEmails').once('value', snap => {
        snap.forEach(child => {
          const d = child.val();
          if (d.userId === userId && d.status === "Done" && d.cleaned === true) earned += (d.reward || 0);
        });
        db.ref('withdrawals/' + userId).once('value', wSnap => {
          wSnap.forEach(child => {
            if (child.val().status === "Done") withdrawn += (child.val().amount || 0);
          });
          callback(Math.max(0, earned - withdrawn));
        });
      });
    }

    let walletListener = null;
    function startLiveWallet() {
      const user = auth.currentUser;
      if (!user) return;
      if (walletListener) walletListener.off();
      walletListener = db.ref().on('value', () => {
        calculateAvailableBalance(user.uid, (bal) => {
          document.getElementById('walletAmount').textContent = bal.toFixed(2);
        });
      });
    }

    // Dashboard
    function loadDashboard() {
      const user = auth.currentUser;
      let html = `
        <h1><i class="fas fa-home"></i> Welcome Back!</h1>
        <div class="stats-grid">
          <div class="stat-card"><h3>Total Added Emails</h3><h2 id="totalEmails">0</h2></div>
          <div class="stat-card"><h3>Total Earn Money</h3><h2 id="totalEarn">$0.00</h2></div>
          <div class="stat-card"><h3>Total Withdrawal</h3><h2 id="totalWithdrawal">0</h2></div>
          <div class="stat-card"><h3>Pending Withdrawal</h3><h2 id="pendingWithdrawal" style="color:#d97706;">0</h2></div>
          <div class="stat-card"><h3>Completed Withdrawal</h3><h2 id="completeWithdrawal" style="color:#16a34a;">0</h2></div>
        </div>
      `;
      document.getElementById('pageContent').innerHTML = html;

      db.ref('addedEmails').on('value', snap => {
        let emails = 0, earn = 0;
        snap.forEach(child => {
          const d = child.val();
          if (d.userId === user.uid) {
            emails++;
            if (d.status === "Done" && d.cleaned === true) earn += (d.reward || 0);
          }
        });
        document.getElementById('totalEmails').textContent = emails;
        document.getElementById('totalEarn').textContent = '$' + earn.toFixed(2);
      });

      db.ref('withdrawals/' + user.uid).on('value', snap => {
        let totalW = 0, pending = 0, complete = 0;
        snap.forEach(child => {
          totalW++;
          if (child.val().status === "Done") complete++;
          else pending++;
        });
        document.getElementById('totalWithdrawal').textContent = totalW;
        document.getElementById('pendingWithdrawal').textContent = pending;
        document.getElementById('completeWithdrawal').textContent = complete;
      });
    }

    // ==================== PROFILE SYSTEM ====================
    window.showProfileModal = function() {
      const user = auth.currentUser;
      if (!user) return alert("Please login first!");

      db.ref('users/' + user.uid).once('value').then(snap => {
        const data = snap.val() || {};
        let html = `
          <div style="text-align:center; margin-bottom:25px;">
            <h3>${data.name || 'User Name'}</h3>
            <p style="color:#64748b;">${user.email}</p>
          </div>
          <div class="btn-group">
            <button class="btn" onclick="viewProfile()">📋 View Profile</button>
            <button class="btn" onclick="editProfile()">✏️ Edit Profile</button>
          </div>
        `;
        document.getElementById('profileContent').innerHTML = html;
        document.getElementById('profileModal').style.display = 'flex';
      });
    };

    function viewProfile() {
      const user = auth.currentUser;
      db.ref('users/' + user.uid).once('value').then(snap => {
        const d = snap.val() || {};
        let html = `
          <div class="profile-info">
            <strong>Name:</strong> ${d.name || 'Not Set'}<br>
            <strong>Email:</strong> ${user.email}<br>
            <strong>Date of Birth:</strong> ${d.dob || 'Not Set'}<br>
            <strong>Gender:</strong> ${d.gender || 'Not Set'}<br>
            <strong>UPI ID:</strong> ${d.upi || 'Not Set'}<br>
            <strong>Phone:</strong> ${d.phone || 'Not Set'}
          </div>
        `;
        document.getElementById('profileContent').innerHTML = html;
      });
    }

    function editProfile() {
      const user = auth.currentUser;
      db.ref('users/' + user.uid).once('value').then(snap => {
        const d = snap.val() || {};
        let html = `
          <div class="form-group"><label>Full Name</label><input id="editName" value="${d.name || ''}"></div>
          <div class="form-group"><label>Date of Birth</label><input type="date" id="editDob" value="${d.dob || ''}"></div>
          <div class="form-group"><label>Gender</label>
            <select id="editGender">
              <option value="">Select Gender</option>
              <option value="Male" ${d.gender==='Male'?'selected':''}>Male</option>
              <option value="Female" ${d.gender==='Female'?'selected':''}>Female</option>
              <option value="Other" ${d.gender==='Other'?'selected':''}>Other</option>
            </select>
          </div>
          <div class="form-group"><label>UPI ID</label><input id="editUpi" value="${d.upi || ''}" placeholder="yourupi@okaxis"></div>
          <div class="form-group"><label>Phone Number</label><input id="editPhone" value="${d.phone || ''}"></div>
          <button class="btn" onclick="saveProfileData()">Save Changes</button>
        `;
        document.getElementById('profileContent').innerHTML = html;
      });
    }

    window.saveProfileData = function() {
      const user = auth.currentUser;
      const data = {
        name: document.getElementById('editName').value.trim(),
        dob: document.getElementById('editDob').value,
        gender: document.getElementById('editGender').value,
        upi: document.getElementById('editUpi').value.trim(),
        phone: document.getElementById('editPhone').value.trim(),
        updatedAt: Date.now()
      };
      db.ref('users/' + user.uid).update(data).then(() => {
        alert("✅ Profile Updated Successfully!");
        viewProfile();
      });
    };

    window.closeProfileModal = () => document.getElementById('profileModal').style.display = 'none';

    // Add Email Page
    function loadAddEmail() {
      let html = `
        <h1><i class="fas fa-envelope"></i> Add New Email</h1>
        <div class="form-group"><label>Email Address *</label><input type="email" id="addEmail" placeholder="example@gmail.com"></div>
        <div class="form-group"><label>Password *</label><input type="password" id="addPass"></div>
        <button class="next-btn" onclick="addNewEmail()">Submit Email</button>
        <div id="addMsg" style="margin-top:15px;text-align:center;"></div>
      `;
      document.getElementById('pageContent').innerHTML = html;
    }

    window.addNewEmail = function() {
      const email = document.getElementById('addEmail').value.trim();
      const pass = document.getElementById('addPass').value.trim();
      const msg = document.getElementById('addMsg');
      const user = auth.currentUser;
      if (!email || !pass) return msg.innerHTML = `<span style="color:red">Email and Password required</span>`;

      db.ref('addedEmails').push({
        email: email,
        password: pass,
        status: "Pending",
        timestamp: Date.now(),
        userId: user.uid,
        cleaned: false
      }).then(() => {
        msg.innerHTML = `<span style="color:green">✅ Email sent to admin for verification.</span>`;
        document.getElementById('addEmail').value = '';
        document.getElementById('addPass').value = '';
      });
    };

    // Withdrawal Page
    function loadWithdrawal() {
      let html = `
        <h1><i class="fas fa-wallet"></i> Withdrawal</h1>
        <div class="balance-info">
          <h2>Available Balance</h2>
          <h1 id="availableBalance">$0.00</h1>
          <small>Minimum Withdrawal: $1</small>
        </div>
        <h2>Request Withdrawal</h2>
        <div class="form-group"><label>Withdrawal Amount (USD)</label><input type="number" id="amount" placeholder="Enter amount (min $1)" min="1" step="0.01"></div>
        <div class="form-group">
          <label>Payment Method</label>
          <select id="method" onchange="togglePaymentFields()">
            <option value="UPI">UPI</option>
            <option value="Bank">Bank Transfer</option>
          </select>
        </div>
        <div id="upiFields"><div class="form-group"><label>UPI ID</label><input type="text" id="upiId" placeholder="example@upi"></div></div>
        <div id="bankFields" style="display:none;">
          <div class="form-group"><label>Bank Holder Name</label><input type="text" id="holderName"></div>
          <div class="form-group"><label>Bank Name</label><input type="text" id="bankName"></div>
          <div class="form-group"><label>Account Number</label><input type="text" id="accountNo"></div>
          <div class="form-group"><label>IFSC Code</label><input type="text" id="ifsc"></div>
        </div>
        <button class="btn" onclick="requestWithdrawal()">Request Withdrawal</button>
        <div id="errorMsg" style="color:red; margin-top:15px; text-align:center;"></div>
        <h2 style="margin-top:40px;">Withdrawal History</h2>
        <div id="withdrawalList">Loading history...</div>
      `;
      document.getElementById('pageContent').innerHTML = html;
      updateAvailableBalance();
      loadWithdrawalHistory();
    }

    window.togglePaymentFields = function() {
      const method = document.getElementById('method').value;
      document.getElementById('upiFields').style.display = (method === 'UPI') ? 'block' : 'none';
      document.getElementById('bankFields').style.display = (method === 'Bank') ? 'block' : 'none';
    };

    function updateAvailableBalance() {
      const user = auth.currentUser;
      calculateAvailableBalance(user.uid, (bal) => {
        document.getElementById('availableBalance').textContent = '$' + bal.toFixed(2);
      });
    }

    window.requestWithdrawal = function() {
      const user = auth.currentUser;
      const amount = parseFloat(document.getElementById('amount').value);
      const method = document.getElementById('method').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      if (!amount || amount < 1) return errorMsg.textContent = 'Minimum withdrawal is $1';

      let paymentData = { method };
      if (method === 'UPI') {
        const upiId = document.getElementById('upiId').value.trim();
        if (!upiId) return errorMsg.textContent = 'Please enter UPI ID';
        paymentData.upiId = upiId;
      } else {
        const holder = document.getElementById('holderName').value.trim();
        const bank = document.getElementById('bankName').value.trim();
        const acc = document.getElementById('accountNo').value.trim();
        const ifsc = document.getElementById('ifsc').value.trim();
        if (!holder || !bank || !acc || !ifsc) return errorMsg.textContent = 'Please fill all bank details';
        paymentData.holderName = holder;
        paymentData.bankName = bank;
        paymentData.accountNo = acc;
        paymentData.ifsc = ifsc;
      }

      calculateAvailableBalance(user.uid, (available) => {
        if (amount > available) return errorMsg.textContent = 'Insufficient balance!';
        db.ref('withdrawals/' + user.uid).push({
          amount: amount,
          ...paymentData,
          status: "Pending",
          timestamp: Date.now()
        }).then(() => {
          alert(`✅ Withdrawal request of $${amount} submitted successfully!`);
          loadWithdrawal();
        });
      });
    };

    function loadWithdrawalHistory() {
      const user = auth.currentUser;
      const container = document.getElementById('withdrawalList');
      db.ref('withdrawals/' + user.uid).on('value', (snapshot) => {
        container.innerHTML = '';
        if (!snapshot.exists()) {
          container.innerHTML = '<p style="color:#666; text-align:center;">No withdrawal requests yet.</p>';
          return;
        }
        snapshot.forEach((child) => {
          const data = child.val();
          const isDone = data.status === "Done";
          let details = data.method === 'UPI' ? `UPI: ${data.upiId}` : `Bank: ${data.bankName} | A/c: ${data.accountNo}`;
          const div = document.createElement('div');
          div.className = `withdrawal-item ${isDone ? 'done' : ''}`;
          div.innerHTML = `
            <div>
              <strong>$${data.amount}</strong> via ${data.method}<br>
              <small>${details}</small><br>
              <small>${new Date(data.timestamp).toLocaleString()}</small>
            </div>
            <span class="status ${isDone ? 'done' : 'pending'}">${data.status || 'Pending'}</span>
          `;
          container.appendChild(div);
        });
      });
    }

    window.loadPage = function(page) {
      document.getElementById('sidebar').classList.remove('active');
      if (page === 'dashboard') loadDashboard();
      else if (page === 'email-add') loadAddEmail();
      else if (page === 'withdrawal') loadWithdrawal();
      else alert(`${page} page under development hai`);
    };

    window.logout = function() {
      if (confirm("Logout karna chahte hain?")) auth.signOut().then(() => location.reload());
    };
  </script>
</body>
</html>
